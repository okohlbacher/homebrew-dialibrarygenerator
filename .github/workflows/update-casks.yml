name: update-casks

# Keeps both casks in step with DIALibGen's releases.
#
# The update logic lives HERE, in the tap, not in the product repo. That is not
# an organisational preference: a push from the product repo into this one would
# need a cross-repository token, and a scheduled run in the tap needs no secret
# at all -- its own GITHUB_TOKEN can read a public release and push here.
#
# The cost is latency (up to six hours) and one GitHub quirk: a scheduled
# workflow is DISABLED after 60 days without a commit to the repository. A run
# that changes nothing makes no commit, so a quiet tap eventually stops checking
# itself. workflow_dispatch is the manual route, and is what a release should
# trigger by hand until that matters.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (default: the latest release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.rel.outputs.skip }}
      version: ${{ steps.rel.outputs.version }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REPO=okohlbacher/DIALibGen
          if [ -n "${WANT:-}" ]; then
            # Validated before it reaches a shell or a URL.
            echo "$WANT" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::'$WANT' is not a vX.Y.Z tag"; exit 1; }
            json=$(gh release view "$WANT" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets)
          else
            json=$(gh release view --repo "$REPO" --json tagName,isDraft,isPrerelease,assets)
          fi
          tag=$(jq -r .tagName <<<"$json")
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::$tag is not a vX.Y.Z tag"; exit 1; }
          [ "$(jq -r .isDraft <<<"$json")" = "false" ] || { echo "::error::$tag is a draft"; exit 1; }
          [ "$(jq -r .isPrerelease <<<"$json")" = "false" ] \
            || { echo "::error::$tag is a pre-release"; exit 1; }

          # Completeness. A cask pins a digest to a URL, so publishing one
          # before every asset is uploaded produces a cask that 404s for
          # whoever installs in the gap.
          have=$(jq -r '.assets[].name' <<<"$json")
          missing=0
          for a in DIALibGen-macos-arm64.tar.gz \
                   DIALibGen-macos-x64.tar.gz \
                   DIALibGen-gui-macos-arm64.dmg \
                   DIALibGen-gui-macos-x64.dmg; do
            grep -qx "$a" <<<"$have" || { echo "$tag is missing $a"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            if [ -n "${WANT:-}" ]; then
              echo "::error::$tag is incomplete"; exit 1
            fi
            # On a schedule this is usually "still uploading". The product
            # repo's own release-complete job is the loud signal, not this.
            echo "::warning::$tag is incomplete -- nothing to do this round"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "skip=false"
            echo "version=${tag#v}"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      # The digests are computed HERE, from the release assets, rather than by
      # `brew bump-cask-pr --version`. That tool is supposed to resolve the url
      # once per architecture; on an arm64 runner it fetched
      # DIALibGen-gui-macos-arm64.dmg twice and wrote the same sha256
      # for arm and intel -- which brew style then rejected, and which would
      # otherwise have shipped an intel cask that refuses its own download.
      # Two curls and a regex have no such opinion.
      - name: Write the version and digests
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          WANT: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/okohlbacher/DIALibGen/releases/download/$TAG"
          digest() {
            curl -fsSL "$base/$1" | shasum -a 256 | cut -d' ' -f1
          }
          for c in dialibgen dialibgen-cli; do
            case "$c" in
              dialibgen)     arm_a=DIALibGen-gui-macos-arm64.dmg
                                       int_a=DIALibGen-gui-macos-x64.dmg ;;
              dialibgen-cli) arm_a=DIALibGen-macos-arm64.tar.gz
                                       int_a=DIALibGen-macos-x64.tar.gz ;;
            esac
            arm=$(digest "$arm_a"); int=$(digest "$int_a")
            # Identical digests for two different files means the wrong file was
            # fetched twice -- the exact failure this step replaces.
            [ "$arm" != "$int" ] \
              || { echo "::error::$c: arm and intel digests are identical"; exit 1; }
            python3 - "Casks/$c.rb" "$WANT" "$arm" "$int" <<'PYEOF'
          import re, sys
          path, version, arm, intel = sys.argv[1:5]
          s = open(path).read()
          s, n = re.subn(r'^  version "[^"]*"$', f'  version "{version}"', s, count=1, flags=re.M)
          assert n == 1, f"{path}: no version stanza"
          s, n = re.subn(
              r'^  sha256 arm:\s*"[0-9a-f]{64}",\n         intel: "[0-9a-f]{64}"$',
              f'  sha256 arm:   "{arm}",\n         intel: "{intel}"',
              s, count=1, flags=re.M)
          assert n == 1, f"{path}: no sha256 stanza in the expected shape"
          open(path, "w").write(s)
          PYEOF
            echo "$c -> $WANT  arm=${arm:0:12} intel=${int:0:12}"
          done

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.rel.outputs.skip != 'true'
        with:
          name: updated-casks
          path: Casks/*.rb
          retention-days: 1
          if-no-files-found: error

  install:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: updated-casks
          path: Casks

      - name: Register the checkout as a tap
        run: |
          set -euo pipefail
          TAPDIR="$(brew --repository)/Library/Taps/okohlbacher/homebrew-dialibrarygenerator"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -sfn "$PWD" "$TAPDIR"
          brew tap-info okohlbacher/dialibrarygenerator
          # Homebrew 6 refuses to load Ruby from an untrusted third-party tap.
          # --tap, and NOT tolerated with `|| true`: without the flag the name
          # is taken as a formula or cask, and a silently-untrusted tap fails
          # several steps later with a message about the cask, not the trust.
          brew trust --tap okohlbacher/dialibrarygenerator

      - name: Audit and style both casks
        run: |
          set -euo pipefail
          for c in dialibgen dialibgen-cli; do
            brew audit --cask --strict --online "okohlbacher/dialibrarygenerator/$c"
            brew style "okohlbacher/dialibrarygenerator/$c"
          done

      - name: Install and verify both casks
        run: |
          set -euo pipefail
          brew install --cask okohlbacher/dialibrarygenerator/dialibgen-cli
          brew install --cask okohlbacher/dialibrarygenerator/dialibgen
          python3 .github/verify-install.py "$EXPECTED_VERSION" "$EXPECTED_ARCH"

      - name: Uninstall both casks
        if: always()
        run: |
          set -euo pipefail
          for c in dialibgen dialibgen-cli; do
            if brew list --cask "$c" >/dev/null 2>&1; then
              brew uninstall --cask "okohlbacher/dialibrarygenerator/$c"
            fi
          done
          # Bash caches command paths; inspect the filesystem after uninstall.
          [ ! -e "$(brew --prefix)/bin/DIALibGen" ]
          [ ! -L "$(brew --prefix)/bin/DIALibGen" ]
          [ ! -e /Applications/DIALibGen.app ]

  commit:
    needs: [prepare, install]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: updated-casks
          path: Casks
      - name: Commit verified casks
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git add Casks
          git diff --cached --quiet && { echo "already current"; exit 0; }
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "casks: DIALibGen $RELEASE_TAG"
          git push
